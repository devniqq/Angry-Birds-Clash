<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angry Birds Clash 🚀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #0f172a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1000px;
            max-height: 600px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border-radius: 16px;
            overflow: hidden;
            background: #1e293b;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f43f5e, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 20px;
        }
        .btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px 36px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .score-board {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            font-size: 1.3rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .score-val { color: #f43f5e; }
        .birds-val { color: #38ef7d; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="score-board">
            <div>Punkte: <span id="score" class="score-val">0</span></div>
            <div>Vögel: <span id="birds" class="birds-val">3</span></div>
        </div>

        <div id="start-screen" class="ui-layer">
            <h1>Angry Birds Clash</h1>
            <p>Ziehe an der Schleuder, ziele genau und besiege alle Schweine!</p>
            <button class="btn" onclick="startGame()">STARTEN</button>
        </div>

        <div id="gameover-screen" class="ui-layer hidden">
            <h1 id="gameover-title">Game Over!</h1>
            <p id="final-score">Punkte: 0</p>
            <button class="btn" onclick="startGame()">NOCHMAL</button>
        </div>

        <canvas id="canvas"></canvas>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const birdsEl = document.getElementById('birds');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const gameoverTitle = document.getElementById('gameover-title');
const finalScoreEl = document.getElementById('final-score');

let W = 1000, H = 600;
let score = 0;
let birdsLeft = 3;
let gameState = 'START';

let slingshot = { x: 150, y: H - 180 };
let currentBird = null;
let blocks = [];
let pigs = [];

let isDragging = false;
let dragPos = { x: slingshot.x, y: slingshot.y };

function resize() {
    const container = document.getElementById('game-container');
    W = container.clientWidth;
    H = container.clientHeight;
    canvas.width = W;
    canvas.height = H;
    slingshot = { x: 150, y: H - 180 };
}
window.addEventListener('resize', resize);
resize();

class Bird {
    constructor(x, y, color = '#f43f5e') {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 16;
        this.color = color;
        this.launched = false;
    }
    update() {
        if (this.launched) {
            this.vy += 0.35; // Schwerkraft
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.99;
            this.vy *= 0.99;

            if (this.y + this.radius >= H - 80) {
                this.y = H - 80 - this.radius;
                this.vy *= -0.4;
                this.vx *= 0.6;
            }
        }
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Augen
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x + 6, this.y - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x + 7, this.y - 4, 2, 0, Math.PI * 2);
        ctx.fill();

        // Schnabel
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(this.x + 10, this.y);
        ctx.lineTo(this.x + 20, this.y + 4);
        ctx.lineTo(this.x + 10, this.y + 8);
        ctx.closePath();
        ctx.fill();
    }
}

class Block {
    constructor(x, y, w, h, hp = 80) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.hp = hp;
    }
    draw() {
        ctx.fillStyle = this.hp > 40 ? '#b45309' : '#d97706';
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(this.x, this.y, this.w, this.h, 4);
        ctx.fill();
        ctx.stroke();
    }
}

class Pig {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16;
    }
    draw() {
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Ohren
        ctx.beginPath();
        ctx.arc(this.x - 10, this.y - 12, 5, 0, Math.PI * 2);
        ctx.arc(this.x + 10, this.y - 12, 5, 0, Math.PI * 2);
        ctx.fill();

        // Nase
        ctx.fillStyle = '#047857';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 2, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function initLevel() {
    birdsLeft = 3;
    score = 0;
    birdsEl.innerText = birdsLeft;
    scoreEl.innerText = score;
    dragPos = { x: slingshot.x, y: slingshot.y };
    currentBird = new Bird(slingshot.x, slingshot.y);

    blocks = [];
    pigs = [];

    let baseX = W - 300;
    let baseY = H - 80;

    // Turm-Struktur bauen
    blocks.push(new Block(baseX, baseY - 120, 20, 120));
    blocks.push(new Block(baseX + 100, baseY - 120, 20, 120));
    blocks.push(new Block(baseX - 10, baseY - 140, 140, 20));

    blocks.push(new Block(baseX + 20, baseY - 260, 20, 120));
    blocks.push(new Block(baseX + 80, baseY - 260, 20, 120));
    blocks.push(new Block(baseX + 10, baseY - 280, 100, 20));

    // Schweinchen platzieren
    pigs.push(new Pig(baseX + 60, baseY - 20));
    pigs.push(new Pig(baseX + 60, baseY - 160));
}

function getEventPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (W / rect.width),
        y: (clientY - rect.top) * (H / rect.height)
    };
}

function startDrag(e) {
    if (gameState !== 'PLAYING' || !currentBird || currentBird.launched) return;
    const pos = getEventPos(e);
    const dist = Math.hypot(pos.x - slingshot.x, pos.y - slingshot.y);
    if (dist < 50) {
        isDragging = true;
    }
}

function moveDrag(e) {
    if (!isDragging) return;
    const pos = getEventPos(e);
    const angle = Math.atan2(pos.y - slingshot.y, pos.x - slingshot.x);
    const dist = Math.min(Math.hypot(pos.x - slingshot.x, pos.y - slingshot.y), 90);

    dragPos.x = slingshot.x + Math.cos(angle) * dist;
    dragPos.y = slingshot.y + Math.sin(angle) * dist;

    currentBird.x = dragPos.x;
    currentBird.y = dragPos.y;
}

function endDrag() {
    if (!isDragging) return;
    isDragging = false;

    const dx = slingshot.x - dragPos.x;
    const dy = slingshot.y - dragPos.y;

    currentBird.vx = dx * 0.22;
    currentBird.vy = dy * 0.22;
    currentBird.launched = true;

    setTimeout(checkTurn, 3500);
}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', startDrag, { passive: false });
canvas.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('touchend', endDrag);

function checkTurn() {
    if (gameState !== 'PLAYING') return;

    if (pigs.length === 0) {
        gameState = 'GAMEOVER';
        gameoverTitle.innerText = 'GEWONNEN! 🎉';
        finalScoreEl.innerText = `Punkte: ${score}`;
        gameoverScreen.classList.remove('hidden');
        return;
    }

    birdsLeft--;
    birdsEl.innerText = birdsLeft;

    if (birdsLeft <= 0) {
        gameState = 'GAMEOVER';
        gameoverTitle.innerText = 'GAME OVER 💥';
        finalScoreEl.innerText = `Punkte: ${score}`;
        gameoverScreen.classList.remove('hidden');
    } else {
        const colors = ['#f43f5e', '#fbbf24', '#60a5fa'];
        currentBird = new Bird(slingshot.x, slingshot.y, colors[3 - birdsLeft]);
    }
}

function startGame() {
    gameState = 'PLAYING';
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    initLevel();
}

function checkCollisions() {
    if (!currentBird || !currentBird.launched) return;

    blocks.forEach((b, index) => {
        if (
            currentBird.x + currentBird.radius > b.x &&
            currentBird.x - currentBird.radius < b.x + b.w &&
            currentBird.y + currentBird.radius > b.y &&
            currentBird.y - currentBird.radius < b.y + b.h
        ) {
            b.hp -= 40;
            currentBird.vx *= -0.5;
            if (b.hp <= 0) blocks.splice(index, 1);
        }
    });

    pigs.forEach((p, index) => {
        const dist = Math.hypot(currentBird.x - p.x, currentBird.y - p.y);
        if (dist < currentBird.radius + p.radius) {
            pigs.splice(index, 1);
            score += 100;
            scoreEl.innerText = score;
        }
    });
}

function render() {
    ctx.clearRect(0, 0, W, H);

    // Himmel & Boden
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#38bdf8');
    grad.addColorStop(1, '#4ade80');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#15803d';
    ctx.fillRect(0, H - 80, W, 80);

    if (gameState === 'PLAYING') {
        // Schleuder-Gummi
        if (isDragging) {
            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(slingshot.x - 12, slingshot.y);
            ctx.lineTo(dragPos.x, dragPos.y);
            ctx.lineTo(slingshot.x + 12, slingshot.y);
            ctx.stroke();
        }

        // Schleuder-Holz
        ctx.fillStyle = '#7c2d12';
        ctx.fillRect(slingshot.x - 6, slingshot.y, 12, H - 80 - slingshot.y);

        if (currentBird) {
            currentBird.update();
            currentBird.draw();
            checkCollisions();
        }

        blocks.forEach(b => b.draw());
        pigs.forEach(p => p.draw());
    }

    requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
